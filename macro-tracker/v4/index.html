let vids=0,months=0,tok=0,truth=0,ap=0,af=0;
DATA.forEach(c=>{truth+=c.truth;tok+=c.transcripts_ok;ap+=c.audit.pass;af+=c.audit.fail;Object.values(c.months).forEach(m=>{months++;vids+=m.videos.filter(v=>!v.extra).length})});
$('#stats').innerHTML=[[tok+' / '+META.total,'字幕达标（全 5 频道）'],[vids,'已分析视频'],[months,'已出月度单元'],[ap+' / '+(ap+af),'引文抽查逐字命中']].map(([b,s])=>`<div class="stat"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join('');
const allM=[...new Set(DATA.flatMap(c=>Object.keys(c.months)))].sort();
let sel=null;
function grid(){
  let h='<tr><th style="text-align:left">频道</th>'+allM.map(m=>`<th>${m.slice(2)}</th>`).join('')+'</tr>';
  DATA.forEach((c,ci)=>{h+=`<tr><td class="ch">${esc(c.channel)}<div class="meta">字幕 ${c.transcripts_ok}/${c.truth}</div></td>`;
    allM.forEach(m=>{const u=c.months[m];if(!u){h+='<td><span class="cell empty">–</span></td>';return}
      const vs=u.videos.filter(v=>!v.extra);const cnt={};vs.forEach(v=>{const s=spx(v.macro_view);cnt[s]=(cnt[s]||0)+1});
      let top=Object.entries(cnt).filter(([k])=>k!=='未提及').sort((a,b)=>b[1]-a[1]);
      let st=top.length?(top.length>1&&top[0][1]===top[1][1]?'中性':top[0][0]):'未提及';
      const isSel=sel&&sel[0]===ci&&sel[1]===m;const bad=c.audit.fails.some(f=>f.month===m);
      h+=`<td><button class="cell v-${st}${isSel?' sel':''}" data-c="${ci}" data-m="${m}" aria-label="${esc(c.channel)} ${m} ${vs.length} 条"><b>${vs.length}</b><small>${st}${bad?' ⚠':''}</small></button></td>`});
    h+='</tr>'});
  $('#grid').innerHTML=h;
  document.querySelectorAll('button.cell').forEach(b=>b.onclick=()=>{sel=[+b.dataset.c,b.dataset.m];grid();detail()});
}
function detail(){
  if(!sel){$('#detail').innerHTML='';return}
  const c=DATA[sel[0]],u=c.months[sel[1]];
  let h=`<h2>${esc(c.channel)} · ${esc(sel[1])}</h2><div class="meta">文件 ${esc(u.file)} · ${u.videos.length} 条</div>`;const rows=c.audit.rows.filter(r=>r.month===sel[1]);const fs=c.audit.fails.filter(f=>f.month===sel[1]);if(rows.length)h+=`<div class="${fs.length?'note':'meta'}">引文抽查 ${rows.length-fs.length}/${rows.length} 逐字命中${fs.length?'；未命中：'+fs.map(f=>esc(f.video_id+(f.detail?'（'+String(f.detail).slice(0,80)+'）':''))).join('；'):''}</div>`;
  u.videos.forEach(v=>{
    const mv=v.macro_view||{};
    h+=`<article class="card"><h3>${esc(v.title)}</h3><div class="meta">${esc(v.publish_date)} · <a href="https://www.youtube.com/watch?v=${esc(v.video_id)}" target="_blank" rel="noopener">${esc(v.video_id)}</a>${v.extra?' · 清单外，不计数':''}</div>
    <div>${esc(v.core_thesis)}</div>
    ${(v.key_points||[]).length?'<ul>'+v.key_points.map(k=>`<li>${esc(k)}</li>`).join('')+'</ul>':''}
    <div class="chips">${Object.entries(mv).map(([k,x])=>`<span class="chip v-${norm(x)}">${esc(k)}·${esc(x)}</span>`).join('')}</div>
    ${(v.predictions||[]).map(p=>`<div class="pred">预测（${esc(p.horizon)}，${esc(p.direction)}）：${esc(p.what)}</div>`).join('')}
    </article>`});
  $('#detail').innerHTML=h;
}
$('#foot').innerHTML='带 ⚠ 的月份有引文没在字幕里逐字找到（转述、简繁改写或内容对不上），已退回返工；结论请以字幕原文为准。'+'美投讲美股、小翠两频道尚在排队，完成后自动并入。本页为只读镜像，修改请改 Drive 源文件后重新同步。';
grid();
const first=DATA.findIndex(c=>Object.keys(c.months).length);if(first>=0){const ms=Object.keys(DATA[first].months).sort();sel=[first,ms[ms.length-1]];grid();detail()}
</script>
</body></html>
