    h+=`<article class="card"><h3>${esc(v.title)}</h3><div class="meta">${esc(v.publish_date)} · <a href="https://www.youtube.com/watch?v=${esc(v.video_id)}" target="_blank" rel="noopener">${esc(v.video_id)}</a>${v.extra?' · 清单外，不计数':''}</div>
    <div>${esc(v.core_thesis)}</div>
    ${(v.key_points||[]).length?'<ul>'+v.key_points.map(k=>`<li>${esc(k)}</li>`).join('')+'</ul>':''}
    <div class="chips">${Object.entries(mv).map(([k,x])=>`<span class="chip v-${norm(x)}">${esc(k)}·${esc(x)}</span>`).join('')}</div>
    ${(v.predictions||[]).map(p=>`<div class="pred">预测（${esc(p.horizon)}，${esc(p.direction)}）：${esc(p.what)}</div>`).join('')}
    </article>`});
  $('#detail').innerHTML=h;
}
$('#foot').innerHTML='带 ⚠ 的月份有引文没在字幕里逐字找到（转述、简繁改写或内容对不上），已退回返工；结论请以字幕原文为准。'+'美投讲美股、小翠两频道尚在排队，完成后自动并入。本页为只读镜像，修改请改 Drive 源文件后重新同步。';
(function(){const S=META.stats||[];const ms=[...new Set(S.flatMap(c=>Object.keys(c.months)))].filter(Boolean).sort();
let h='<tr><th style="text-align:left">频道</th>'+ms.map(m=>`<th>${m.slice(2)}</th>`).join('')+'<th>合计</th></tr>';
S.forEach(c=>{let N=0,Sb=0,A=0;h+=`<tr><td class="ch">${esc(c.channel)}</td>`+ms.map(m=>{const r=c.months[m];if(!r)return '<td class="meta">–</td>';N+=r.n;Sb+=r.sub;A+=r.ana;return `<td><b>${r.n}</b><div class="meta">${r.sub}·${r.ana}</div></td>`}).join('')+`<td><b>${N}</b><div class="meta">${Sb}·${A}</div></td></tr>`});
const tot=S.reduce((a,c)=>{Object.values(c.months).forEach(r=>{a[0]+=r.n;a[1]+=r.sub;a[2]+=r.ana});return a},[0,0,0]);
h+=`<tr><td class="ch">全部</td>`+ms.map(m=>{let n=0,s=0,a=0;S.forEach(c=>{const r=c.months[m];if(r){n+=r.n;s+=r.sub;a+=r.ana}});return `<td><b>${n}</b><div class="meta">${s}·${a}</div></td>`}).join('')+`<td><b>${tot[0]}</b><div class="meta">${tot[1]}·${tot[2]}</div></td></tr>`;
$('#stat').innerHTML=h})();
grid();
const first=DATA.findIndex(c=>Object.keys(c.months).length);if(first>=0){const ms=Object.keys(DATA[first].months).sort();sel=[first,ms[ms.length-1]];grid();detail()}
