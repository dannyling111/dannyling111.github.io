<script>

const S = JSON.parse(document.getElementById("SNAP").textContent);
const H = ["1w","1m","1y","5y"];
const HL = { "1w":"1周","1m":"1月","1y":"1年","5y":"5年" };
const NAV = [
  { to:"#/", id:"macro", label:"宏观" },
  { to:"#/assets", id:"assets", label:"资产" },
  { to:"#/evidence", id:"evidence", label:"证据" },
  { to:"#/health", id:"health", label:"健康" },
];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmtPct(n, d=1, signed=true){
  const s = Number(n).toFixed(d);
  if (!signed) return s + "%";
  return (n>0?"+":"") + s + "%";
}
function fmtNum(n, d=2){
  if (Math.abs(n) >= 1000) return Number(n).toLocaleString("en-US", {maximumFractionDigits:0});
  return Number(n).toFixed(d);
}
function fmtAsOf(iso){
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const p = n => String(n).padStart(2,"0");
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())} UTC`;
}
function statusLabel(s){ return s==="OK"?"正常":s==="DEGRADED"?"降级":"弃权"; }
function dirLabel(p){ return p>=0.58?"偏多":p<=0.42?"偏空":"中性"; }
function toneDir(p){ return p>=0.58?"up":p<=0.42?"down":"flat"; }
function toneNum(n){ return n>0.05?"up":n<-0.05?"down":"flat"; }
function route(){
  const h = (location.hash || "#/").replace(/^#/, "");
  const parts = h.split("/").filter(Boolean);
  if (parts[0]==="assets" && parts[1]) return { name:"asset", id:decodeURIComponent(parts[1]) };
  if (parts[0]==="assets") return { name:"assets" };
  if (parts[0]==="evidence") return { name:"evidence" };
  if (parts[0]==="health") return { name:"health" };
  return { name:"macro" };
}
function navHtml(active){
  return NAV.map(n => `<a href="${n.to}" class="${n.id===active?"on":""}">${n.label}</a>`).join("");
}
function header(){
  const cls = S.system_status==="OK"?"tone-up":S.system_status==="DEGRADED"?"tone-warn":"tone-down";
  $("#hdr").innerHTML = `<b class="${cls==="tone-up"?"tone-up":S.system_status==="DEGRADED"?"tone-warn":"tone-down"}" style="color:${S.system_status==="OK"?"var(--up)":S.system_status==="DEGRADED"?"var(--warn)":"var(--down)"}">${statusLabel(S.system_status)}</b><span class="tabular">${fmtAsOf(S.forecast_as_of)}</span>`;
}
function fan(fc){
  const vals = [fc.p10, fc.p50, fc.p90];
  const min = Math.min(-8, ...vals);
  const max = Math.max(8, ...vals);
  const x = v => ((v-min)/(max-min))*100;
  const a = Math.min(x(fc.p10), x(fc.p90));
  const b = Math.max(x(fc.p10), x(fc.p90));
  return `<div class="fan">
    <div class="h"><span>${HL[fc.horizon]}</span><span class="tabular tone-${toneNum(fc.p50)}">${fmtPct(fc.p50)} · ${dirLabel(fc.direction_prob)} ${Math.round(fc.direction_prob*100)}%</span></div>
    <div class="rng"><i class="band" style="left:${a}%;width:${Math.max(2,b-a)}%"></i><i class="mid" style="left:${x(fc.p50)}%"></i></div>
    <div class="h"><span class="tabular">p10 ${fmtPct(fc.p10)}</span><span class="tabular">p90 ${fmtPct(fc.p90)}</span></div>
  </div>`;
}
function pageMacro(){
  const regime = S.regime.labels.map(r => `<div class="row"><div style="width:76px;font-size:12px;color:var(--muted)">${esc(r.label)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(r.probability*100)}%"></div></div><div class="tabular" style="width:40px;text-align:right;font-size:12px">${Math.round(r.probability*100)}%</div></div>`).join("");
  const macros = S.macro.map(m => {
    const f = m.forecasts["1m"];
    return `<article class="card">
      <div style="display:flex;justify-content:space-between;gap:8px"><h3 style="margin:0;font-size:13px;color:var(--muted);font-weight:500">${esc(m.label)}</h3><span class="k">${esc(m.unit)}</span></div>
      <div class="tabular" style="font-size:22px;margin:8px 0 4px">${fmtNum(m.nowcast, m.unit.includes("%")||m.id==="employment"||m.id==="inflation"||m.id==="growth"?2:3)}</div>
      <div style="font-size:12px;color:var(--muted);line-height:1.5">${esc(m.comment)}</div>
      ${fan(f)}
    </article>`;
  }).join("");
  const featured = ["us_equity","duration","gold","energy","usd","btc"];
  const assets = S.assets.filter(a => featured.includes(a.meta.id)).map(a => {
    const f = a.forecasts["1m"];
    return `<a class="asset" href="#/assets/${a.meta.id}">
      <div><div class="t">${esc(a.meta.ticker)}</div><div class="n">${esc(a.meta.name)}</div></div>
      <div style="text-align:right"><div class="tabular">${fmtNum(a.meta.last)}</div><div class="tabular tone-${toneDir(f.direction_prob)}" style="font-size:12px">${dirLabel(f.direction_prob)} ${Math.round(f.direction_prob*100)}%</div></div>
    </a>`;
  }).join("");
  return `<div>
    <div class="meta"><span>forecast_as_of</span><span class="tabular">${fmtAsOf(S.forecast_as_of)}</span><span>·</span><span>data_cutoff</span><span class="tabular">${fmtAsOf(S.data_cutoff)}</span></div>
    <div style="margin-top:10px"><span class="pill ${S.system_status==="OK"?"ok":S.system_status==="DEGRADED"?"warn":"bad"}">${statusLabel(S.system_status)}</span>
      ${S.status_reason?`<span style="margin-left:8px;font-size:12px;color:var(--warn)">${esc(S.status_reason)}</span>`:""}</div>
    <h2 class="display">${esc(S.headline)}</h2>
    <p class="lede">${esc(S.summary)}</p>
    <section class="card" style="margin:22px 0">
      <div class="k">体制概率</div>
      ${regime}
      <p style="margin:10px 0 0;font-size:12px;color:var(--dim);line-height:1.6">${esc(S.regime.tradable_t1)}</p>
    </section>
    <h3 style="font-family:var(--display);font-size:20px;font-weight:500;margin:8px 0 12px">宏观六块</h3>
    <div class="grid2">${macros}</div>
    <div style="display:flex;justify-content:space-between;align-items:end;margin:22px 0 12px">
      <h3 style="font-family:var(--display);font-size:20px;font-weight:500;margin:0">核心资产</h3>
      <a href="#/assets" style="font-size:12px;color:var(--dim)">全部 14 类</a>
    </div>
    <div class="grid2">${assets}</div>
    <p class="foot">${esc(S.disclaimer)} · ${esc(S.model_version)}</p>
  </div>`;
}
function pageAssets(){
  const groups = [...new Set(S.assets.map(a => a.meta.group))];
  const rows = S.assets.map(a => {
    const f = a.forecasts["1m"];
    return `<a class="asset" href="#/assets/${a.meta.id}">
      <div><div class="t">${esc(a.meta.group)} · ${esc(a.meta.ticker)}</div><div class="n">${esc(a.meta.name)}</div></div>
      <div style="text-align:right;white-space:nowrap">
        <div class="tabular">${fmtNum(a.meta.last)}</div>
        <div class="tabular tone-${toneDir(f.direction_prob)}" style="font-size:12px">${dirLabel(f.direction_prob)} ${Math.round(f.direction_prob*100)}%</div>
      </div>
    </a>`;
  }).join("");
  return `<div>
    <h2 class="display">大类资产矩阵</h2>
    <p class="lede">14 类资产 × 四期限。点进去看扇形区间、驱动与失效条件。中位数来自引擎，不是 LLM 改写。</p>
    <div style="display:grid;gap:10px;margin-top:16px">${rows}</div>
  </div>`;
}
function pageAsset(id){
  const a = S.assets.find(x => x.meta.id === id);
  if (!a) return `<p>未找到资产 ${esc(id)}</p>`;
  const fans = H.map(h => fan(a.forecasts[h])).join("");
  const f1 = a.forecasts["1m"];
  const drivers = (f1.drivers||[]).slice(0,6).map(d => `<div class="row" style="margin:6px 0"><div style="flex:1;font-size:13px">${esc(d.label)}</div><div class="tabular tone-${toneNum(d.contribution)}" style="font-size:12px">${d.contribution>0?"+":""}${d.contribution.toFixed(2)}</div></div>`).join("");
  const inv = (f1.invalidators||[]).map(x => `<li style="margin:6px 0">${esc(x)}</li>`).join("");
  const sc = (f1.scenarios||[]).map(s => `<div class="card" style="padding:12px"><div class="k">${esc(s.label)}</div><div class="tabular" style="font-size:18px;margin:4px 0">${Math.round(s.probability*100)}%</div><div style="font-size:12px;color:var(--muted);line-height:1.5">${esc(s.narrative)}</div></div>`).join("");
  return `<div>
    <a class="back" href="#/assets">← 资产矩阵</a>
    <div class="meta" style="margin-top:8px"><span>${esc(a.meta.ticker)}</span><span>·</span><span>${esc(a.meta.group)}</span></div>
    <h2 class="display">${esc(a.meta.name)}</h2>
    <div class="tabular" style="font-size:28px">${fmtNum(a.meta.last)}</div>
    <p class="lede" style="margin-top:8px">1 月 ${dirLabel(f1.direction_prob)} ${Math.round(f1.direction_prob*100)}% · 中位 ${fmtPct(f1.p50)} · 置信 ${Math.round(f1.confidence*100)}%</p>
    <section class="card" style="margin:18px 0"><div class="k">四期限扇形</div>${fans}</section>
    <h3 style="font-family:var(--display);font-size:18px;font-weight:500">驱动</h3>
    <section class="card">${drivers || "<div style='color:var(--dim);font-size:13px'>无</div>"}</section>
    <h3 style="font-family:var(--display);font-size:18px;font-weight:500;margin-top:18px">情景</h3>
    <div class="grid2">${sc}</div>
    <h3 style="font-family:var(--display);font-size:18px;font-weight:500;margin-top:18px">失效条件</h3>
    <ul style="padding-left:18px;color:var(--muted);font-size:14px;line-height:1.6">${inv}</ul>
  </div>`;
}
function pageEvidence(){
  const items = S.evidence.map(e => `<article class="ev">
    <div class="meta"><span>${esc(e.source_name)}</span><span>·</span><span class="tabular">${esc((e.published_at||"").slice(0,10))}</span><span>·</span><span>${esc(e.source_tier)}</span></div>
    <h3 style="margin:8px 0 6px;font-size:16px;font-weight:500">${esc(e.title)}</h3>
    ${(e.claims||[]).slice(0,2).map(c => `<p style="margin:0 0 6px;color:var(--muted);font-size:13px;line-height:1.6">${esc(c.text)}</p>`).join("")}
    ${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener" style="font-size:12px;color:var(--accent)">来源</a>`:""}
  </article>`).join("");
  return `<div><h2 class="display">证据时间线</h2><p class="lede">只纳入 available_at ≤ forecast_as_of 的信息。LLM 只做抽取与解释，不改数值。</p><section class="card" style="margin-top:16px">${items}</section></div>`;
}
function pageHealth(){
  const src = S.health.sources.map(r => `<tr><td>${esc(r.name)}</td><td class="tabular">${r.age_hours.toFixed(0)}h</td><td>${esc(r.status)}</td><td style="color:var(--dim)">${esc(r.sla)}</td></tr>`).join("");
  const models = S.health.models.filter(m => m.horizon==="1m").slice(0,12).map(m => `<tr><td>${esc(m.model_id)}</td><td>${esc(m.role)}</td><td class="tabular">${m.brier==null?"—":m.brier.toFixed(3)}</td><td class="tabular">${m.hit_rate==null?"—":fmtPct(m.hit_rate*100,0,false)}</td><td>${m.qualified?"合格":"观察"}</td></tr>`).join("");
  return `<div>
    <h2 class="display">模型健康</h2>
    <p class="lede">walk-forward 校准与源新鲜度。系统状态：${statusLabel(S.system_status)}。最近完好快照 ${fmtAsOf(S.health.last_good_as_of)}。</p>
    <h3 style="font-family:var(--display);font-size:18px;font-weight:500;margin-top:18px">数据源</h3>
    <div class="card" style="overflow-x:auto"><table class="m"><tr><th>源</th><th>龄</th><th>状态</th><th>SLA</th></tr>${src}</table></div>
    <h3 style="font-family:var(--display);font-size:18px;font-weight:500;margin-top:18px">1 月模型</h3>
    <div class="card" style="overflow-x:auto"><table class="m"><tr><th>模型</th><th>角色</th><th>Brier</th><th>命中</th><th>资格</th></tr>${models}</table></div>
    <p class="foot">${esc(S.disclaimer)}</p>
  </div>`;
}
function render(){
  header();
  const r = route();
  const active = r.name==="asset"?"assets":r.name;
  $("#desk").innerHTML = navHtml(active);
  $("#bot").innerHTML = navHtml(active);
  $("#app").innerHTML = r.name==="macro"?pageMacro()
    : r.name==="assets"?pageAssets()
    : r.name==="asset"?pageAsset(r.id)
    : r.name==="evidence"?pageEvidence()
    : pageHealth();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", render);
render();

</script>
</body>
</html>
